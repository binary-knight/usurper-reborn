# Usurper Reborn — Docker Compose
#
# Usage:
#   docker compose up -d              Start all services
#   docker compose logs -f usurper-game   Follow game server logs
#   docker compose down               Stop all services
#
# Game server listens on port 4000 (raw TCP) for BBS/MUD client connections.
# Web interface available on port 80 (browser play + dashboards).
#
# Customize (DO THIS BEFORE EXPOSING THE SERVER TO A NETWORK):
#   - Replace "YourAdminName" with your admin username
#   - Set BALANCE_PASS to a real password. It is deliberately NOT set below:
#     the admin dashboard (which fronts world-wipe, bans, and player edits)
#     refuses every route except change-password while the shipped default
#     password is still active, so an unconfigured deploy cannot be nuked by
#     anyone who read this file. Setting BALANCE_PASS=changeme counts as
#     unconfigured and stays locked.
#   - Mount your own index.html: ./my-landing.html:/opt/usurper/web/index.html

services:
  usurper-game:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - usurper-data:/var/usurper
    command:
      - "--mud-server"
      - "--mud-port"
      - "4000"
      - "--db"
      - "/var/usurper/usurper_online.db"
      - "--log-stdout"
      - "--auto-provision"
      - "--sim-interval"
      - "30"
      - "--admin"
      - "YourAdminName"
    # The web proxy opens the database once at startup and never reconnects, so
    # it must not start before the game server has created the file.
    healthcheck:
      test: ["CMD", "test", "-f", "/var/usurper/usurper_online.db"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped

  usurper-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    volumes:
      - usurper-data:/var/usurper
    environment:
      - MUD_MODE=1
      - WEB_BIND_HOST=0.0.0.0         # nginx reaches this container by service name; only nginx is published
      - MUD_HOST=usurper-game
      - MUD_PORT=4000                 # must match --mud-port above (the proxy's own default is 4001)
      - DB_PATH=/var/usurper/usurper_online.db
      - BALANCE_USER=admin
      # Set a real password here before exposing this deploy. Leaving it unset
      # (or setting it to 'changeme') keeps the admin dashboard locked to the
      # change-password flow only. See the header comment.
      # - BALANCE_PASS=pick-something-long-and-unique
      # SSH gateway account used only when MUD_MODE=0 (legacy SSH hop).
      # - SSH_USER=usurper
      # - SSH_PASS=set-a-real-one
      # Optional integrations (all off when unset); see DOCS/DOCKER.md.
      # - WS_MAX_CONN_PER_IP=8         # browser sessions allowed per client IP
      # - BUG_REPORT_WEBHOOK_URL=      # Discord webhook that receives in-game /bug reports
      # - DISCORD_BOT_TOKEN=           # with DISCORD_GOSSIP_CHANNEL_ID: mirror world news to Discord
      # - DISCORD_GOSSIP_CHANNEL_ID=
      # - DISCORD_STATS_CHANNEL_ID=    # optional live stats embed
      # - GITHUB_PAT=                  # read-only token for the sponsors list on the landing page
    depends_on:
      usurper-game:
        condition: service_healthy
    restart: unless-stopped

  usurper-nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    ports:
      - "80:80"
    depends_on:
      - usurper-web
    restart: unless-stopped

volumes:
  usurper-data:
