<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Bench</title>
<style>
    :root { --bg: #101014; --panel: #1b1b21; --line: #3c3c46; --text: #f0f0f2; --dim: #b8b8c2; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; z-index: 2; }
    .bar h1 { font-size: 15px; margin: 0; }
    .bar nav { display: flex; gap: 6px; }
    .bar a { color: var(--text); text-decoration: none; border: 1px solid var(--line); padding: 4px 10px; }
    .bar a[aria-current="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
    .bar .note { color: var(--dim); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; }
    .cell { min-width: 0; }
    .cell h2 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--dim); }
    .frame { position: relative; overflow: hidden; border: 1px solid var(--line); background: #000; }
    .frame iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: 0 0; background: #000; }
    .gray iframe { filter: grayscale(1); }
    .pair { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; }
    @media (max-width: 900px) { .grid, .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="bar">
    <h1>Bench</h1>
    <nav id="dirs"></nav>
    <span class="note" id="name"></span>
</div>
<div class="grid">
    <div class="cell"><h2>Desktop 1440 x 900</h2><div class="frame" data-w="1440" data-h="900"></div></div>
    <div class="cell"><h2>Desktop 1440 x 900, greyscale (value structure)</h2><div class="frame gray" data-w="1440" data-h="900"></div></div>
    <div class="cell pair-host" style="grid-column: 1 / -1;">
        <div class="pair">
            <div class="cell"><h2>Tablet 768 x 1024</h2><div class="frame" data-w="768" data-h="1024"></div></div>
            <div class="cell"><h2>Mobile 390 x 844</h2><div class="frame" data-w="390" data-h="844"></div></div>
        </div>
    </div>
</div>
<script>
(function () {
    var NAMES = { a: 'A: Phosphor ledger', b: 'B: Woodcut and iron', c: 'C: Illuminated chronicle', '': 'Current: live site' };
    var raw = (new URLSearchParams(location.search).get('direction') || '').toLowerCase();
    var dir = NAMES.hasOwnProperty(raw) ? raw : '';
    document.getElementById('name').textContent = NAMES[dir];

    var nav = document.getElementById('dirs');
    ['a', 'b', 'c', ''].forEach(function (d) {
        var a = document.createElement('a');
        a.href = d ? '?direction=' + d : '?';
        a.textContent = d ? d.toUpperCase() : 'Current';
        if (d === dir) a.setAttribute('aria-current', 'true');
        nav.appendChild(a);
    });

    var src = '/index.html' + (dir ? '?direction=' + dir : '');
    var frames = Array.prototype.slice.call(document.querySelectorAll('.frame'));
    frames.forEach(function (box) {
        var f = document.createElement('iframe');
        f.width = box.dataset.w;
        f.height = box.dataset.h;
        f.title = box.previousElementSibling.textContent;
        f.src = src;
        box.appendChild(f);
    });

    function fit() {
        frames.forEach(function (box) {
            var w = Number(box.dataset.w), h = Number(box.dataset.h);
            box.style.maxWidth = w + 'px';
            var s = Math.min(1, box.clientWidth / w);
            box.style.height = Math.round(h * s) + 'px';
            box.firstChild.style.transform = 'scale(' + s + ')';
        });
    }
    window.addEventListener('resize', fit);
    fit();
})();
</script>
</body>
</html>
