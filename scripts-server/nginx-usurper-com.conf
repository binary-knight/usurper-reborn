# usurper-reborn.com: install as /etc/nginx/sites-available/usurper-com, link it into sites-enabled, then
# nginx -t and reload; certificate: certbot certonly --nginx --cert-name usurper-reborn.com for both names.
# usurper-reborn.com: every request is sent to the one real address, usurper-reborn.net.
server {
    listen 80;
    server_name usurper-reborn.com www.usurper-reborn.com;
    return 301 https://usurper-reborn.net$request_uri;
}

server {
    listen 443 ssl;
    server_name usurper-reborn.com www.usurper-reborn.com;
    ssl_certificate /etc/letsencrypt/live/usurper-reborn.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/usurper-reborn.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://usurper-reborn.net$request_uri;
}
