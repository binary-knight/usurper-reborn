# Usurper Reborn - Cache-Control for pages, styles, scripts and language files (2.0).
# Install: sudo cp nginx-cache.conf /etc/nginx/snippets/usurper-cache.conf
# The value comes from the map in nginx-cache-map.conf; the site config includes this
# file from its main server block, next to the CSP snippet, so both headers apply to
# every location (a location with its own add_header would drop both, so none has one).
add_header Cache-Control $usurper_cache_control;
