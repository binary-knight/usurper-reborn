# Usurper Reborn - which static files a browser must revalidate (2.0).
# Install: sudo cp nginx-cache-map.conf /etc/nginx/conf.d/usurper-cache-map.conf
# A map belongs in the http block; Ubuntu's nginx.conf includes conf.d/*.conf there.
#
# Pages, styles, scripts and language files keep their names across deploys, so a
# browser that reuses its stored copy can run an old page against new data (raw text
# keys showed after a deploy until a hard refresh). "no-cache" lets the browser keep
# the copy but makes it ask first; an unchanged file answers 304 with no body.
# Everything else (images, fonts, the API) gets an empty value, and nginx sends no
# header for an empty add_header value, so those responses are unchanged.
map $uri $usurper_cache_control {
    default "";
    ~\.(?:html|css|js|json)$ "no-cache";
    ~/$ "no-cache";
}
