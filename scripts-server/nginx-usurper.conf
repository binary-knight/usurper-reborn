# Usurper Reborn - Nginx Configuration
# Install: sudo cp nginx-usurper.conf /etc/nginx/sites-available/usurper
#          sudo ln -s /etc/nginx/sites-available/usurper /etc/nginx/sites-enabled/
#          sudo mkdir -p /etc/nginx/snippets
#          sudo cp nginx-csp.conf /etc/nginx/snippets/usurper-csp.conf
#          sudo cp nginx-cache.conf /etc/nginx/snippets/usurper-cache.conf
#          sudo cp nginx-cache-map.conf /etc/nginx/conf.d/usurper-cache-map.conf
#          sudo cp nginx-private.conf /etc/nginx/snippets/usurper-private.conf
#          sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: After deploying this config, re-run certbot to restore SSL:
#   sudo certbot --nginx -d usurper-reborn.net -d www.usurper-reborn.net --redirect
# Certbot adds listen 443 ssl directives and certificate paths automatically.
# usurper-reborn.com and its www name redirect here from their own site file, nginx-usurper-com.conf.

# v0.65.8 (audit T2 ops): rate-limit zones. limit_req protects /api/* from
# hammering (stats endpoints are cached server-side, so 10 r/s per IP is
# generous for legit browsers); limit_conn caps concurrent WS/terminal
# connections per IP (the ws proxy also enforces its own per-IP cap).
limit_req_zone $binary_remote_addr zone=usurper_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=usurper_conn:10m;

# v1.1.8: nginx.conf turns gzip on but leaves gzip_types at its default, which is
# text/html alone, so every API response shipped raw. Measured through nginx, the
# dashboard's NPC payload went from 2,283,013 bytes to 405,614.
# text/event-stream is deliberately absent: the news feed below runs with
# proxy_buffering off, and compressing it would buffer it.
gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;

# Redirect www to bare domain
server {
    listen 80;
    server_name www.usurper-reborn.net;
    return 301 http://usurper-reborn.net$request_uri;
}

# Main site
server {
    listen 80 default_server;
    server_name usurper-reborn.net play.usurper-reborn.net _;

    root /opt/usurper/web;
    index index.html;

    # 1.2.8: Content-Security-Policy, enforcing (the browser blocks anything outside
    # the policy; no reports are sent). The header text lives in nginx-csp.conf.
    # A location block that sets its own add_header would drop this one for that
    # location, so none does.
    include /etc/nginx/snippets/usurper-csp.conf;

    # 2.0: Cache-Control no-cache for pages, styles, scripts and language files, so a
    # returning browser revalidates them after a deploy (nginx-cache.conf and its map).
    include /etc/nginx/snippets/usurper-cache.conf;

    # 2.0: the web folder also holds the web service's .env, .bak copies, package
    # manifests, node_modules and server scripts; nginx answers 404 for them
    # (nginx-private.conf). Its regex locations come before the ones below.
    include /etc/nginx/snippets/usurper-private.conf;

    # Dashboard (clean URL without .html)
    location = /dashboard {
        try_files /dashboard.html =404;
    }

    # Balance dashboard (clean URL without .html)
    location = /balance {
        try_files /balance.html =404;
    }

    # Admin dashboard (clean URL without .html)
    location = /admin {
        try_files /admin.html =404;
    }

    # Steam-safe landing page (no playable terminal or download links)
    location = /steam {
        try_files /steam.html =404;
    }

    # Static files
    location / {
        try_files $uri $uri/ =404;
    }

    # SSE feeds (must disable buffering for real-time events)
    # Rate-limited lightly: SSE is one long-lived request, so the connection
    # cap is the meaningful control here.
    location ~ ^/api/(feed|dash/feed)$ {
        limit_conn usurper_conn 10;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
        chunked_transfer_encoding off;
    }

    # API proxy for stats dashboard
    location /api/ {
        limit_req zone=usurper_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy for browser terminal
    location /ws {
        limit_conn usurper_conn 10;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }
}
