# Usurper Reborn - files nginx never serves from the web folder (2.0).
# Install: sudo cp nginx-private.conf /etc/nginx/snippets/usurper-private.conf
# The web folder (root /opt/usurper/web) also holds the web service itself: its environment file (.env),
# .bak copies, the package manifests, node_modules and the server scripts no page loads. The site config
# includes this file from its main server block, next to the CSP snippet, before its own locations.
# ssh-proxy.js (staticFilePath) refuses the same set when node serves the folder.
location ~ /\.(?!well-known/) { return 404; }
location ~ \.bak$ { return 404; }
location ~ ^/(?:package(?:-lock)?\.json|ssh-proxy\.js|gmcp-split\.js|wiki-bot\.js|wiki-search\.js|dash-npcs\.js|dash-monster-names\.js|dash-observatory\.js)$ { return 404; }
location ^~ /node_modules/ { return 404; }
