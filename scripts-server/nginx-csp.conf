# Usurper Reborn - Content-Security-Policy in report-only mode (1.2.6).
# Install: sudo cp nginx-csp.conf /etc/nginx/snippets/usurper-csp.conf
# The site config includes it from its server block(s); see nginx-usurper.conf.
#
# Report-only: the browser logs violations to its own console and blocks nothing.
# There is no report endpoint, so nothing is sent anywhere. "always" applies the
# header to every response status, error pages included.
#
# Sources, checked against every page in web/ and the built wiki:
#   scripts   own origin, inline blocks and static handlers, cdn.jsdelivr.net
#             (chart.js, d3, xterm, xterm addon-fit)
#   styles    own origin, inline blocks and style attributes, fonts.googleapis.com
#             (also the wiki stylesheet import), cdn.jsdelivr.net (xterm css)
#   fonts     fonts.gstatic.com
#   images    own origin, data: (favicon), avatars.githubusercontent.com (sponsors)
#   connect   own origin (fetch, event streams) and the terminal websocket
#   frames    the Steam store widget and the Discord widget (index and steam pages)
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self' wss://usurper-reborn.net wss://play.usurper-reborn.net; frame-src https://store.steampowered.com https://discord.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
